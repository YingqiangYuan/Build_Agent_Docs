[project]
name = "learn_build_agent_docs_skill"
description = "Learn build a reusable Agent Skill for discovering, organizing, and learning from the official documentation of leading AI coding agents."
version = "0.1.1"
requires-python = ">=3.12,<4.0"
dependencies = [
    "httpx2>=2.5.0,<3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["learn_build_agent_docs_skill*"]
exclude = [
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
